[package]
name = "oscars"
version = "0.1.0"
edition = "2024"

[dependencies]
hashbrown = "0.16.1"
oscars_derive = { path = "../oscars_derive", version = "0.1.0" }
rustc-hash = "2.1.1"
thin-vec = { version = "0.2", optional = true }
# Optional Trace/Finalize impls for external types.
icu_locale_core = { version = "2.2.0", default-features = false, optional = true }
either = { version = "1.16.0", optional = true }
arrayvec = { version = "0.7.6", optional = true }
typeid = "1.0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
trybuild = "1.0"

boa_gc = { git = "https://github.com/boa-dev/boa", branch = "main" }

[[bench]]
name = "oscars_vs_boa_gc"
harness = false
required-features = ["mark_sweep"]

[[bench]]
name = "arena2_vs_mempool3"
harness = false
required-features = ["mark_sweep2"]

[[bench]]
name = "arena2_vs_boa_gc"
harness = false
required-features = ["mark_sweep2"]

[features]
default = ["mark_sweep"]
std = []
mark_sweep = []
mark_sweep2 = ["mark_sweep"]
mark_sweep_branded = ["mark_sweep"]
null_collector = ["mark_sweep"]
null_collector_branded = ["mark_sweep"]
thin-vec = ["dep:thin-vec", "mark_sweep"]
icu = ["dep:icu_locale_core", "mark_sweep"]
either = ["dep:either", "mark_sweep"]
arrayvec = ["dep:arrayvec", "mark_sweep"]
